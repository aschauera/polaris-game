name: Validate foundation
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  pr-approval:
    name: ${{ github.event_name == 'pull_request' && 'pr-approval' || 'pr-approval-not-required' }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: pr-approval
    steps:
      - name: Record explicit owner approval
        run: echo "Pull-request validation approved by the required environment reviewer."

  validate:
    name: ${{ github.event_name == 'pull_request' && 'validate-pr' || 'validate' }}
    needs: pr-approval
    if: ${{ always() && (github.event_name != 'pull_request' || needs.pr-approval.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: pwsh -NoProfile -File ./scripts/azure-setup.tests.ps1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
