name: Trigger auto deployment for polaris

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ feat/azure-container-app-setup ]
    paths:
    - '**'
    - '.github/workflows/polaris-AutoDeployTrigger-c3b2f5fd-10fe-45cb-83ab-78817662aa64.yml'

  # Allow manual trigger 
  workflow_dispatch:
      
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.POLARIS_AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: polarisgameanaschau.azurecr.io
          registryUsername: ${{ secrets.POLARIS_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.POLARIS_REGISTRY_PASSWORD }}
          containerAppName: polaris
          resourceGroup: polaris-rg
          imageToBuild: polarisgameanaschau.azurecr.io/polaris:${{ github.sha }}
          
            

     

