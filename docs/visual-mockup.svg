<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Polaris original map prototype visual concept</title>
  <desc id="desc">Labeled concept, not a screenshot. Navy, teal, gold and ivory Art Deco HUD surrounding an original block-built isometric landscape with water, forest, hills, mountains and a gold selected tile. Ownership and fog examples are future design only.</desc>
  <defs>
    <pattern id="grid" width="80" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20 40 0 80 20 40 40Z" fill="none" stroke="#F2E9D4" stroke-opacity=".16"/>
    </pattern>
    <g id="tile">
      <path d="M0 0 40 20 0 40-40-20Z" fill="#287F82" stroke="#102538" stroke-width="2"/>
      <path d="M-40 20 0 40 0 53-40-20Z" fill="#194F60"/>
      <path d="M0 40 40 20 40 33 0 53Z" fill="#22686B"/>
    </g>
    <g id="hill">
      <use href="#tile"/>
      <path d="M-28 18 0 4 28 18 0 32Z" fill="#77A79B"/>
      <path d="M-28 18 0 32 0 41-28-14Z" fill="#346D70"/>
      <path d="M0 32 28 18 28 27 0 41Z" fill="#518D85"/>
      <path d="M-17 12 0 4 17 12 0 20Z" fill="#A0B8A0"/>
    </g>
    <g id="tree">
      <path d="M-3 0 3 0 3 18-3 18Z" fill="#D6AF58"/>
      <path d="M0-31 17-22 17-6 0 3-17-6-17-22Z" fill="#194F60"/>
      <path d="M0-31 17-22 0-13-17-22Z" fill="#65A998"/>
      <path d="M0-47 12-41 12-24 0-18-12-24-12-41Z" fill="#287F82"/>
      <path d="M0-47 12-41 0-35-12-41Z" fill="#94BDA6"/>
    </g>
    <g id="forest">
      <use href="#tile"/>
      <use href="#tree" transform="translate(-13 20)"/>
      <use href="#tree" transform="translate(14 21) scale(.85)"/>
    </g>
    <g id="mountain">
      <use href="#tile"/>
      <path d="M-27 22-27-5-17-10-17-30-7-35-7-54 7-61 18-54 18-28 28-23 28 21 0 35Z" fill="#749291"/>
      <path d="M0-57 7-61 18-54 7-48-7-54Z" fill="#F2E9D4"/>
      <path d="M7-48 18-54 18-28 28-23 28 21 0 35 0-10 7-14Z" fill="#426976"/>
      <path d="M-17-30-7-35 0-31-10-26Z" fill="#C8D1BF"/>
    </g>
    <g id="water">
      <path d="M0 10 40 30 0 50-40-20Z" fill="#205774" stroke="#102538" stroke-width="2"/>
      <path d="M-21 28-7 35M2 24 18 32M5 41 19 34" stroke="#7BB5BB" stroke-width="2"/>
    </g>
  </defs>
  <rect width="1200" height="800" fill="#102538"/>
  <rect x="16" y="16" width="1168" height="768" rx="6" fill="none" stroke="#D6AF58" stroke-width="2"/>
  <path d="M30 85H1170M30 704H1170" stroke="#D6AF58"/>
  <g font-family="system-ui, sans-serif">
    <text x="42" y="55" fill="#F2E9D4" font-size="28" letter-spacing="7">POLARIS</text>
    <text x="305" y="52" fill="#D6AF58" font-size="16" letter-spacing="2">MAP PROTOTYPE · ORIGINAL VISUAL CONCEPT</text>
    <text x="42" y="112" fill="#A0B8B8" font-size="14">NOT A SCREENSHOT · Planned interface and art direction</text>
    <rect x="40" y="140" width="244" height="316" rx="4" fill="#17384B" stroke="#426976"/>
    <text x="60" y="171" fill="#D6AF58" font-size="17" letter-spacing="2">WORLD SETUP</text>
    <text x="60" y="205" fill="#F2E9D4" font-size="14">Seed · 1–64 ASCII characters</text>
    <rect x="60" y="218" width="202" height="38" fill="#102538" stroke="#426976"/>
    <text x="73" y="243" fill="#F2E9D4" font-size="16">Polaris_01</text>
    <text x="60" y="285" fill="#F2E9D4" font-size="14">Width × depth · integers 8–256</text>
    <rect x="60" y="298" width="202" height="38" fill="#102538" stroke="#426976"/>
    <text x="73" y="323" fill="#F2E9D4" font-size="16">32 × 32 showcase</text>
    <rect x="60" y="354" width="202" height="38" fill="#287F82" stroke="#D6AF58"/>
    <text x="161" y="379" text-anchor="middle" fill="#F2E9D4" font-size="16">Generate map</text>
    <text x="60" y="423" fill="#A0B8B8" font-size="13">Case-sensitive, reproducible seed</text>
    <path d="M324 184 666 135 1097 367 757 648 326 416Z" fill="#17384B"/>
    <path d="M324 184 666 135 1097 367 757 648 326 416Z" fill="url(#grid)"/>
    <!-- Small illustrative terrain patch, not a literal 32-by-32 map. -->
    <g transform="translate(666 241)">
      <use href="#mountain" x="0" y="0"/>
      <use href="#hill" x="40" y="20"/>
      <use href="#tile" x="80" y="40"/>
      <use href="#forest" x="120" y="60"/>
      <use href="#hill" x="160" y="80"/>
      <use href="#water" x="-40" y="20"/>
      <use href="#mountain" x="0" y="40"/>
      <use href="#hill" x="40" y="60"/>
      <use href="#forest" x="80" y="80"/>
      <use href="#tile" x="120" y="100"/>
      <use href="#water" x="-80" y="40"/>
      <use href="#water" x="-40" y="60"/>
      <use href="#tile" x="0" y="80"/>
      <use href="#tile" x="40" y="100"/>
      <use href="#forest" x="80" y="120"/>
      <use href="#water" x="-120" y="60"/>
      <use href="#water" x="-80" y="80"/>
      <use href="#tile" x="-40" y="100"/>
      <use href="#tile" x="0" y="120"/>
      <use href="#hill" x="40" y="140"/>
      <use href="#water" x="-160" y="80"/>
      <use href="#water" x="-120" y="100"/>
      <use href="#tile" x="-80" y="120"/>
      <use href="#forest" x="-40" y="140"/>
      <use href="#tile" x="0" y="160"/>
      <path d="M40 101 79 120 40 139 1 120Z" fill="none" stroke="#D6AF58" stroke-width="4"/>
      <path d="M36 115H44M40 111V119" stroke="#F2E9D4" stroke-width="2"/>
      <path d="M-11 83 0 77 11 83 0 89Z" fill="#D6AF58" stroke="#F2E9D4"/>
    </g>
    <path d="M745 362H924" fill="none" stroke="#D6AF58"/>
    <text x="926" y="356" fill="#D6AF58" font-size="14">Gold selection perimeter</text>
    <text x="926" y="378" fill="#A0B8B8" font-size="12">Independent of ownership</text>
    <rect x="40" y="477" width="244" height="199" rx="4" fill="#17384B" stroke="#D6AF58"/>
    <text x="60" y="510" fill="#D6AF58" font-size="17" letter-spacing="2">TILE INSPECTOR</text>
    <text x="60" y="544" fill="#F2E9D4" font-size="16">Example · x 18 / z 15</text>
    <text x="60" y="572" fill="#F2E9D4" font-size="14">Canonical ID · 498 (width 32)</text>
    <text x="60" y="600" fill="#F2E9D4" font-size="14">Terrain · Plains</text>
    <text x="60" y="628" fill="#F2E9D4" font-size="14">Resource · None</text>
    <text x="60" y="655" fill="#A0B8B8" font-size="12">Illustrative data, not a live selection</text>
    <text x="350" y="521" fill="#F2E9D4" font-size="15">Stepped peaks · clustered crowns · flat water</text>
    <text x="350" y="545" fill="#A0B8B8" font-size="13">Fixed orthographic view · world x east / z south / y up</text>
    <rect x="350" y="569" width="794" height="105" rx="4" fill="#17384B" stroke="#426976"/>
    <text x="370" y="594" fill="#D6AF58" font-size="13" letter-spacing="1">FUTURE VISUAL KEY · NOT PROTOTYPE GAMEPLAY</text>
    <rect x="372" y="613" width="34" height="34" fill="#287F82" stroke="#F2E9D4" stroke-dasharray="4 3"/>
    <text x="389" y="636" text-anchor="middle" fill="#F2E9D4" font-size="17">M</text>
    <text x="418" y="635" fill="#F2E9D4" font-size="13">Ownership: border + symbol</text>
    <rect x="662" y="613" width="34" height="34" fill="#426976"/>
    <text x="708" y="635" fill="#F2E9D4" font-size="13">Explored: subdued</text>
    <rect x="901" y="613" width="34" height="34" fill="#0A1724" stroke="#426976"/>
    <text x="947" y="635" fill="#F2E9D4" font-size="13">Unseen: opaque</text>
    <text x="42" y="743" fill="#F2E9D4" font-size="15">Pan · Zoom · Select tile</text>
    <text x="350" y="743" fill="#A0B8B8" font-size="14">Square grid · four-cardinal movement planned · no camera rotation</text>
    <rect x="1012" y="719" width="132" height="41" fill="#17384B" stroke="#D6AF58"/>
    <text x="1078" y="745" text-anchor="middle" fill="#F2E9D4" font-size="14">Reset view</text>
  </g>
</svg>
